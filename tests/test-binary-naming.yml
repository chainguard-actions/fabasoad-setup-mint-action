---
name: Test binary naming for new version on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.20.1"
      - name: Assert mint is installed and executable
        run: |
          echo "Checking mint is available on PATH..."
          if ! command -v mint > /dev/null 2>&1; then
            echo "FAIL: mint not found on PATH"
            exit 1
          fi
          MINT_BIN="$(which mint)"
          echo "mint binary location: $MINT_BIN"
          if [ ! -x "$MINT_BIN" ]; then
            echo "FAIL: mint binary is not executable"
            exit 1
          fi
          echo "PASS: mint is installed and executable"
      - name: Assert mint binary is in workspace mint directory
        run: |
          echo "Checking mint binary is in GITHUB_WORKSPACE/mint..."
          MINT_BIN="$(which mint)"
          echo "mint binary location: $MINT_BIN"
          EXPECTED_DIR="${GITHUB_WORKSPACE}/mint"
          echo "expected dir: $EXPECTED_DIR"
          if ! echo "$MINT_BIN" | grep -qF "$EXPECTED_DIR"; then
            echo "FAIL: mint binary not in expected directory. Got: $MINT_BIN"
            exit 1
          fi
          echo "PASS: mint binary is in expected directory"
      - name: Assert mint binary is named mint
        run: |
          echo "Checking mint binary is named 'mint'..."
          MINT_BIN="$(which mint)"
          MINT_BASENAME="$(basename "$MINT_BIN")"
          echo "mint binary basename: $MINT_BASENAME"
          if [ "$MINT_BASENAME" != "mint" ]; then
            echo "FAIL: expected binary name 'mint' but got: $MINT_BASENAME"
            exit 1
          fi
          echo "PASS: mint binary is named 'mint'"
