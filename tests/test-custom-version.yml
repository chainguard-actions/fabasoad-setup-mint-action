---
name: Test custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install a fake mint binary to skip download
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/mint" << 'EOF'
          #!/bin/sh
          echo "Mint 0.20.0"
          EOF
          chmod +x "$HOME/.local/bin/mint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          version: "0.20.0"
      - name: Assert mint is on PATH
        run: |
          echo "Checking mint is available on PATH..."
          if ! command -v mint > /dev/null 2>&1; then
            echo "FAIL: mint command not found on PATH"
            exit 1
          fi
          echo "PASS: mint is available on PATH"
      - name: Assert mint version
        run: |
          echo "Checking mint version..."
          MINT_VERSION="$(mint 2>&1 || true)"
          echo "mint output: $MINT_VERSION"
          if echo "$MINT_VERSION" | grep -q "0.20.0"; then
            echo "PASS: mint version matches 0.20.0"
          else
            echo "FAIL: expected mint version 0.20.0, got: $MINT_VERSION"
            exit 1
          fi
