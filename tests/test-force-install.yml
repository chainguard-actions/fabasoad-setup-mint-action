name: Test force=false skips installation when mint already present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install fake mint binary into PATH
        run: |
          mkdir -p /usr/local/bin
          printf '#!/bin/sh\necho "Mint 0.0.0-test"\n' > /usr/local/bin/mint
          chmod +x /usr/local/bin/mint
          which mint
          mint
      - name: Call action with force=false (should skip installation)
        id: skip-install
        uses: .
        with:
          force: "false"
      - name: Assert installed output is false when force=false and mint present
        env:
          ACTUAL: ${{ steps.skip-install.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected installed=false when force=false and mint already present, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: correctly skipped installation"
      - name: Assert mint still available after skip
        run: |
          if ! command -v mint > /dev/null 2>&1; then
            echo "FAIL: mint not found in PATH after skip"
            exit 1
          fi
          echo "mint found at: $(command -v mint)"
          mint
          echo "PASS"
