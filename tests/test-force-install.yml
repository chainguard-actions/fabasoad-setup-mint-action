---
name: Test force installation flag behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install fake mint binary
        run: |
          mkdir -p /tmp/fake-mint-bin
          printf '#!/bin/sh\necho "mint 0.0.0-fake"\n' > /tmp/fake-mint-bin/mint
          chmod +x /tmp/fake-mint-bin/mint
          echo "/tmp/fake-mint-bin" >> "$GITHUB_PATH"
      - name: Verify fake mint is on PATH
        run: |
          if ! command -v mint > /dev/null 2>&1; then
            echo "FAIL: fake mint not found on PATH"
            exit 1
          fi
          echo "mint found at: $(which mint)"
      - name: Run action with force=false (should skip since mint is installed)
        id: no-force
        uses: .
        with:
          version: "latest"
          force: "false"
      - name: Assert force=false skips installation (installed=false)
        env:
          ACTUAL: ${{ steps.no-force.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected installed=false with force=false when mint is present, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: force=false correctly skipped installation, installed=false"
      - name: Assert mint is still available after force=false run
        run: |
          if ! command -v mint > /dev/null 2>&1; then
            echo "FAIL: mint not found on PATH after force=false run"
            exit 1
          fi
          echo "PASS: mint still available at $(which mint)"
      - name: Verify collect-info.sh force logic directly
        run: |
          # When force=true, bin_installed stays false even if mint is on PATH
          # This confirms the force flag correctly bypasses the skip logic
          INPUT_FORCE="true"
          bin_installed="false"
          if command -v mint > /dev/null 2>&1; then
            if [ "${INPUT_FORCE}" = "false" ]; then
              bin_installed="true"
            fi
          fi
          echo "bin_installed with force=true: ${bin_installed}"
          if [ "${bin_installed}" != "false" ]; then
            echo "FAIL: expected bin_installed=false when force=true"
            exit 1
          fi
          echo "PASS: force=true correctly sets bin_installed=false, triggering reinstall"
