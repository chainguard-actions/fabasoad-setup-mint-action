name: Test basic usage - skip install when mint already present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install fake mint binary into PATH
        run: |
          mkdir -p /usr/local/bin
          printf '#!/bin/sh\necho "Mint 0.0.0-test"\n' > /usr/local/bin/mint
          chmod +x /usr/local/bin/mint
          which mint
          mint
      - id: action
        uses: .
        with:
          force: "false"
      - name: Assert installed output is false (mint was already installed, skip)
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected installed=false (skip), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert mint is still available in PATH
        run: |
          if ! command -v mint > /dev/null 2>&1; then
            echo "FAIL: mint not found in PATH"
            exit 1
          fi
          echo "mint found at: $(command -v mint)"
          mint
          echo "PASS"
