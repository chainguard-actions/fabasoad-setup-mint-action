---
name: Test basic usage (latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          force: "false"
          github-token: ${{ github.token }}
      - name: Assert installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected installed=true but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: installed=true"
      - name: Assert mint binary is available
        run: |
          echo "PATH: $PATH"
          if ! command -v mint > /dev/null 2>&1; then
            echo "FAIL: mint binary not found in PATH"
            exit 1
          fi
          echo "PASS: mint is available at $(which mint)"
      - name: Assert mint version command works
        run: |
          mint version
          echo "PASS: mint version command succeeded"
