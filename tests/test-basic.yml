---
name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert mint is on PATH
        run: |
          echo "Checking mint is available on PATH..."
          if ! command -v mint > /dev/null 2>&1; then
            echo "FAIL: mint command not found on PATH"
            exit 1
          fi
          echo "PASS: mint is available"
      - name: Assert mint version is default (0.18.0)
        run: |
          VERSION_OUTPUT=$(mint version 2>&1 || true)
          echo "mint version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "0.18.0"; then
            echo "PASS: mint version is 0.18.0"
          else
            echo "FAIL: expected mint version 0.18.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
      - name: Assert mint binary exists in workspace
        run: |
          echo "Checking mint binary in workspace..."
          if [ ! -f "$GITHUB_WORKSPACE/mint/mint" ]; then
            echo "FAIL: mint binary not found at $GITHUB_WORKSPACE/mint/mint"
            exit 1
          fi
          echo "PASS: mint binary exists"
