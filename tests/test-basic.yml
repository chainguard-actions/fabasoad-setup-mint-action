---
name: Test basic usage - default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert mint is on PATH
        run: |
          echo "Checking mint binary..."
          if ! command -v mint > /dev/null 2>&1; then
            echo "FAIL: mint not found on PATH"
            exit 1
          fi
          echo "PASS: mint is available on PATH"
      - name: Assert mint version output
        run: |
          echo "Running mint --version..."
          MINT_VERSION=$(mint --version 2>&1 || true)
          echo "mint version output: $MINT_VERSION"
          if [ -z "$MINT_VERSION" ]; then
            echo "FAIL: mint --version produced no output"
            exit 1
          fi
          echo "PASS: mint --version returned: $MINT_VERSION"
