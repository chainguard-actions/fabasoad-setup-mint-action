name: "Setup Mint"
author: Yevhen Fabizhevskyi
description: "This action sets up a Mint programming language."
branding:
  icon: feather
  color: green
inputs:
  version:
    description: "Mint version"
    required: false
    default: "0.20.0-alpha.1"
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Fail
      if: (runner.os == 'Windows' || (runner.os == 'Linux' && runner.arch == 'ARM') || (runner.os == 'Linux' && runner.arch == 'ARM64'))
      run: |
        echo "::error title=OS is not supported::${RUNNER_OS} ${RUNNER_ARCH} is not supported"
        exit 1
      shell: sh
    - name: Collect info
      id: info
      env:
        INPUT_VERSION: "${{ inputs.version }}"
      run: ./collect-info.sh
      shell: sh
      working-directory: "${{ github.action_path }}/src"
    - name: Download
      if: ${{ steps.info.outputs.MINT_INSTALLED == 'false' }}
      uses: robinraju/release-downloader@c39a3b234af58f0cf85888573d361fb6fa281534 # v1.10
      with:
        repository: mint-lang/mint
        latest: false
        tag: ${{ inputs.version }}
        fileName: ${{ steps.info.outputs.MINT_BINARY }}
        tarBall: false
        zipBall: false
        out-file-path: mint
    - name: Install
      if: ${{ steps.info.outputs.MINT_INSTALLED == 'false' }}
      env:
        MINT_BINARY: ${{ steps.info.outputs.MINT_BINARY }}
        MINT_PATH: ${{ steps.info.outputs.MINT_PATH }}
      run: |
        mv "$MINT_BINARY" mint
        chmod +x mint
        safe_path=$(printf '%s' "$MINT_PATH" | tr -d '\n\r')
        echo "$safe_path" >> "$GITHUB_PATH"
      shell: sh
      working-directory: ${{ steps.info.outputs.MINT_PATH }}
